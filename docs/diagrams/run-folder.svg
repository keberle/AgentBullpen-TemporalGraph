<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Tree of the files in a run folder with a one-line description of each" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="arrow-run-folder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(255,255,255,0.45)"/></marker></defs>
<rect width="1000" height="620" fill="#000000"/>
<text x="20" y="30" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">runs/&lt;runId&gt;/ — THE SYSTEM OF RECORD (GITIGNORED)</text>
<text x="40" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">run.json</text>
<text x="300" y="62" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">commands · book · chapters · text SHA-256 · git commit · skills (version, hash) · sampling · model</text>
<text x="40" y="86" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="86" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">stage-0.json</text>
<text x="300" y="86" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">chapters · paragraph count · chunk plan</text>
<text x="40" y="110" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="110" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">checks.json</text>
<text x="300" y="110" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">the 7 Layer 1 checks: name · passed · details</text>
<text x="40" y="134" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="134" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">stage-1.json</text>
<text x="300" y="134" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">mentions with offsets, evidence, score, votes · the whole vote pool</text>
<text x="40" y="158" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="158" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">stage-2.json</text>
<text x="300" y="158" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">entities · aliases · merges with reasons · conflicts</text>
<text x="40" y="182" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="182" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">stage-3.json</text>
<text x="300" y="182" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">edges · Fact/Event nodes · votes · pools · rejects by reason</text>
<text x="40" y="206" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="206" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">stage-4.json</text>
<text x="300" y="206" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">story dates · dateVotes · unstable · fabula_seq · event_order</text>
<text x="40" y="230" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="230" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">book.sqlite</text>
<text x="300" y="230" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">the run's graph as a book database (query --db; index promote)</text>
<text x="40" y="254" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="254" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">calls.jsonl</text>
<text x="300" y="254" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">one line per LLM attempt: request · response · usage · latency · trace id · fingerprint · retries</text>
<text x="40" y="278" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="278" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">failures.jsonl</text>
<text x="300" y="278" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">one line per failure with its taxonomy tag</text>
<text x="40" y="302" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="302" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">failures.md</text>
<text x="300" y="302" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">failures grouped by tag with examples — what a loop reads</text>
<text x="40" y="326" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="326" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">crosscheck.json</text>
<text x="300" y="326" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">LitBank / BookNLP: not in ours · not in theirs · alias differences</text>
<text x="40" y="350" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="350" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">scores.json / facts-scores.json</text>
<text x="300" y="350" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">P · R · F1 · error counts · heldOut</text>
<text x="40" y="374" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">├─</text>
<text x="62" y="374" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">cost.json</text>
<text x="300" y="374" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">calls and tokens per stage; money “unknown” until Pricing is set</text>
<text x="40" y="398" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="start">└─</text>
<text x="62" y="398" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">chat.jsonl</text>
<text x="300" y="398" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">tool calls and turns of a chat</text>
<text x="20" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#FFFFFF" text-anchor="start">runs/&lt;timestamp&gt;-&lt;short hash&gt;/</text>
<text x="20" y="440" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">WRITTEN BY</text>
<text x="20" y="460" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">index prepare → run, stage-0, checks   ·   index mentions / resolve / facts / time → stage-N, calls, failures, cost   ·   index build-db → book.sqlite</text>
<text x="20" y="478" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="start">index crosscheck → crosscheck   ·   index score → scores, failures.md   ·   chat → chat.jsonl, calls, cost   ·   runs diff and index keep read, never write</text>
