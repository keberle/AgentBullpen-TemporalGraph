<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Flow of the evidence check: normalize, exact match, Smith-Waterman score, name-in-quote test, accept with offsets or reject to failures.jsonl" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="arrow-evidence-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(255,255,255,0.45)"/></marker></defs>
<rect width="1000" height="600" fill="#000000"/>
<text x="20" y="30" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">WHAT HAPPENS TO EVERY ITEM THE MODEL RETURNS</text>
<rect x="20" y="60" width="190" height="80" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="115.0" y="90.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Model returns</text>
<text x="115.0" y="108.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">text · type</text>
<text x="115.0" y="123.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">evidence quote (verbatim)</text>
<rect x="260" y="60" width="170" height="80" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="345.0" y="90.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Normalize</text>
<text x="345.0" y="108.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">curly → straight quotes</text>
<text x="345.0" y="123.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">whitespace collapsed</text>
<rect x="480" y="60" width="170" height="80" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="565.0" y="97.5" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Exact match?</text>
<text x="565.0" y="115.5" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">substring of the chunk</text>
<rect x="700" y="60" width="190" height="80" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="795.0" y="90.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Smith-Waterman</text>
<text x="795.0" y="108.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">match +2 · mismatch −1 · gap −1</text>
<text x="795.0" y="123.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">score = best ÷ 2·len</text>
<line x1="210" y1="100" x2="260" y2="100" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" marker-end="url(#arrow-evidence-check)"/>
<line x1="430" y1="100" x2="480" y2="100" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" marker-end="url(#arrow-evidence-check)"/>
<line x1="650" y1="100" x2="700" y2="100" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" marker-end="url(#arrow-evidence-check)"/>
<text x="675" y="92" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">no</text>
<rect x="480" y="200" width="170" height="80" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="565.0" y="230.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Name inside quote?</text>
<text x="565.0" y="248.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">the item's own text must</text>
<text x="565.0" y="263.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">occur in its evidence</text>
<path d="M 565 140 L 565 200" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" marker-end="url(#arrow-evidence-check)"/>
<text x="556" y="192" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="end">yes</text>
<path d="M 795 140 L 795 170 L 565 170" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.4"/>
<text x="690" y="164" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">score ≥ 0.9 (Indexing:EvidenceThreshold)</text>
<rect x="260" y="200" width="170" height="80" rx="8" fill="#0A0A0A" stroke="#60A5FA" stroke-width="1.6"/>
<text x="345.0" y="230.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Accept</text>
<text x="345.0" y="248.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">offsets into the book</text>
<text x="345.0" y="263.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">→ revealed_pos</text>
<line x1="480" y1="240" x2="430" y2="240" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" marker-end="url(#arrow-evidence-check)"/>
<text x="455" y="232" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">yes</text>
<rect x="700" y="200" width="190" height="80" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="795.0" y="230.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Reject</text>
<text x="795.0" y="248.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">failures.jsonl</text>
<text x="795.0" y="263.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">“quote mismatch”</text>
<line x1="650" y1="240" x2="700" y2="240" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-evidence-check)"/>
<text x="675" y="232" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">no</text>
<path d="M 795 170 L 795 200" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-evidence-check)"/>
<text x="840" y="186" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">score &lt; 0.9</text>
<text x="20" y="320" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">REAL REJECTS FROM THE FIRST RUNS</text>
<rect x="20" y="332" width="660" height="92" rx="8" fill="#000000" stroke="rgba(255,255,255,0.45)" stroke-width="1.0"/>
<text x="36" y="352" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">“Mr. Holmes”  with evidence  “Why do you hesitate?”          → name not in quote (the model resolved a speaker)</text>
<text x="36" y="370" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">“Sir Charles”  with evidence  “He being the heir?”             → name not in quote (a pronoun resolved)</text>
<text x="36" y="388" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">“farrier”  with  “I have cross-examined these men, ... one a farrier...”   → score 0.689, stitched quote</text>
<text x="36" y="406" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">34 of 48 rejects across three runs were names missing from their evidence; 4 of 600 quotes failed the score.</text>
<text x="20" y="450" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="rgba(255,255,255,0.6)" text-anchor="start">The same shape applies upstream: Stage 3 rejects types outside the ontology and unknown endpoints;</text>
<text x="20" y="468" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="rgba(255,255,255,0.6)" text-anchor="start">Stage 4 rejects invalid EDTF and dates whose year is not in their reasoning quote.</text>
<g font-family="'JetBrains Mono', Consolas, monospace">
<rect x="680" y="522" width="300" height="58" fill="#000000" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<line x1="758" y1="522" x2="758" y2="580" stroke="rgba(255,255,255,0.18)"/>
<text x="688" y="535.5" font-size="10" letter-spacing="1" fill="rgba(255,255,255,0.6)">SHEET</text>
<text x="766" y="535.5" font-size="11" fill="#FFFFFF">3 of 13</text>
<line x1="680" y1="541.2" x2="980" y2="541.2" stroke="rgba(255,255,255,0.18)"/>
<text x="688" y="554.7" font-size="10" letter-spacing="1" fill="rgba(255,255,255,0.6)">TITLE</text>
<text x="766" y="554.7" font-size="11" fill="#FFFFFF">Nothing ungrounded</text>
<line x1="680" y1="560.4" x2="980" y2="560.4" stroke="rgba(255,255,255,0.18)"/>
<text x="688" y="573.9" font-size="10" letter-spacing="1" fill="rgba(255,255,255,0.6)">SCALE</text>
<text x="766" y="573.9" font-size="11" fill="#FFFFFF">None whatsoever</text>
</g>
</svg>