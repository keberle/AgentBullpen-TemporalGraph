<text x="110" y="448" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">indexing moves from Azure gpt-4.1-mini to Claude Haiku 5.5 after a four-model bake-off; the chat keeps gpt-4.1-mini</text>
<text x="20" y="466" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">the graph</text>
<text x="110" y="466" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">facts as nodes, perception and discovery edges, both clocks on everything, a made-up anchor date instead of a chronology</text>
