<text x="905" y="243" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="middle">target</text>
<path d="M 905 272 L 905 300 L 310 300 L 310 272" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-gold-loop)"/>
<text x="600" y="294" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">held-out F1 only</text>
<text x="20" y="322" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">WHAT THE TWO LOOPS DID</text>
<rect x="20" y="332" width="960" height="110" rx="8" fill="#000000" stroke="rgba(255,255,255,0.45)" stroke-width="1.0"/>
<text x="36" y="352" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">Loop 1: 3 runs per version, one-sd rule — both edits reverted; six runs of the unchanged skills spread 0.712 ± 0.039. The loop was measuring noise.</text>
<text x="36" y="372" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">The fix: temperature 0 + seed (noise halves to ± 0.021), paired keep rule, 2 × standard error.</text>
<text x="36" y="392" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">Loop 2: 5 runs, voting k=5, Stage 2 tested on frozen Stage 1 (margin ≈ 0.003) — one rule kept, four reverted. F1 0.737 ± 0.005 at m=4.</text>
<text x="36" y="412" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">Kept rule, verbatim: a building or institution named without the word for its kind is the same entity when its quotes use it that way.</text>
<text x="36" y="430" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">No chapter 8 detail was opened during either loop; the scripts discarded everything but the run id and the F1.</text>
<g font-family="'JetBrains Mono', Consolas, monospace">
