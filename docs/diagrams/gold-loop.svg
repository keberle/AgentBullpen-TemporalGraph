<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="The gold and improvement loop: review, import, score, edit a learned rule, run N times, apply the paired keep rule; the held-out chapter supplies only an aggregate F1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
