<text x="100.0" y="244.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">logged with run ids in</text>
<text x="100.0" y="259.0" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">docs/indexing-runs/</text>
<line x1="230" y1="236" x2="180" y2="236" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" marker-end="url(#arrow-gold-loop)"/>
<path d="M 100 200 L 100 160 L 690 160 L 690 132" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-gold-loop)"/>
<text x="395" y="154" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">re-score the next version</text>
<rect x="830" y="60" width="150" height="212" rx="8" fill="#000000" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="905" y="84" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Held-out</text>
<text x="905" y="102" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Hound ch. 8</text>
<text x="905" y="126" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="middle">ch08.json</text>
<text x="905" y="150" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="middle">the loop sees</text>
